project:
  type: website
  render:
    - "*.qmd"

website:
  title: "NFIDD"
  site-url: https://nfidd.github.io/
  repo-url: https://github.com/nfidd/nfidd.github.io
  repo-actions: [source, issue]
  description: "Nowcasting and forecasting infectious disease dynamics"
  body-footer: '<script data-goatcounter="https://nfidd.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>'
  open-graph: true
  favicon: nfidd-favicon.png
  navbar:
    left: 
      - authors.qmd
    right:
      - icon: github
        href: https://github.com/nfidd

format:
  html:
    theme:
      light: cosmo
      dark: solar
    css: styles.css
    link-external-icon: true
    link-external-newwindow: true
    toc: false
